<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../games/chess/chess.css">
<link rel="stylesheet" href="../games/blackjack/blackjack.css">
<link rel="stylesheet" href="../games/music/music.css">
<link rel="stylesheet" href="../ui/tokens.css">
<link rel="stylesheet" href="../ui/shell.css">
<link rel="stylesheet" href="../ui/components.css">
<link rel="stylesheet" href="../ui/pages.css">
<link rel="stylesheet" href="../ui/games.css">
<link rel="stylesheet" href="../ui/responsive.css">
<link rel="stylesheet" href="../ui/gameplay-fixes.css">
<style>
html,body{margin:0;width:100%;height:100%;background:#050605}#results{position:fixed;z-index:999999;left:4px;top:4px;background:#fff;color:#000;padding:5px;font:10px monospace;max-width:95vw}.mock-topbar{position:fixed;left:0;top:0;width:var(--v7-nav);height:100dvh;background:#090a09}
</style></head><body class="tdb-v7"><div id="results">RUNNING</div><div id="mount"></div>
<script>
const q=new URLSearchParams(location.search);const fixture=q.get('fixture')||'chess';const focus=q.get('focus')==='1';if(focus)document.body.classList.add('tdb-game-focus');
const mount=document.getElementById('mount'),results=[];const pass=(name,ok,d='')=>results.push({name,ok,details:d});const frame=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
function insideViewport(el){const r=el.getBoundingClientRect();return r.left>=-1&&r.right<=innerWidth+1&&r.width>0}
function noHorizontalOverflow(el){return el.scrollWidth<=el.clientWidth+2}
async function chess(){
 const sq=Array.from({length:64},(_,i)=>`<button class="chess-square ${((Math.floor(i/8)+(i%8))%2)?'dark':'light'}"><span class="chess-piece white">♙</span></button>`).join('');
 mount.innerHTML=`${focus?'':'<div class="mock-topbar"></div>'}<section class="chess-screen"><aside class="chess-left-panel"><div class="chess-panel-brand"><strong>TDB</strong></div></aside><main class="chess-center"><div class="chess-player-bar"><div class="chess-player-avatar">A</div><div class="chess-player-info"><strong>Adversário</strong></div><div class="chess-clock">05:00</div></div><div class="chess-turn-banner"><strong>SUA VEZ</strong></div><div class="chess-board-shell"><div class="chess-board">${sq}</div></div><div class="chess-player-bar"><div class="chess-player-avatar">V</div><div class="chess-player-info"><strong>Você</strong></div><div class="chess-clock">05:00</div></div></main><aside class="chess-right-panel"><div class="chess-side-section"><h3>HISTÓRICO DE JOGADAS</h3><div class="chess-history">${Array.from({length:24},(_,i)=>`<div class="history-row"><span>${i+1}.</span><strong>e4</strong><strong>e5</strong></div>`).join('')}</div></div><div class="chess-side-section"><h3>PEÇAS CAPTURADAS</h3><div>♙♙♘♗</div></div><div class="chess-side-actions"><button class="btn">Empate</button><button class="btn">Desistir</button><button class="btn">Voltar</button></div></aside></section>`;
 await frame();const screen=document.querySelector('.chess-screen'),board=document.querySelector('.chess-board'),right=document.querySelector('.chess-right-panel');const br=board.getBoundingClientRect();
 pass('chess-screen-no-horizontal-overflow',noHorizontalOverflow(screen),`${screen.clientWidth}/${screen.scrollWidth}`);pass('chess-right-visible',getComputedStyle(right).display!=='none');pass('chess-right-inside-viewport',insideViewport(right),JSON.stringify(right.getBoundingClientRect().toJSON?.()||{}));pass('chess-board-usable',br.width>=Math.min(500,innerWidth*.48),`${Math.round(br.width)}x${Math.round(br.height)}`);pass('chess-square',Math.abs(br.width-br.height)<3);
}
async function music(){
 mount.innerHTML=`${focus?'':'<div class="mock-topbar"></div>'}<section class="music-screen"><aside class="music-sidebar"><div class="music-brand"><strong>TDB LOBBY</strong></div><div class="music-members">Pessoas</div></aside><main class="music-main"><section class="lounge-screen-stage"></section><section class="music-player-card"><div class="music-now-header"><h1>Música atual</h1></div><div class="music-player-wrap"><div id="musicYoutubePlayer"></div></div><div class="music-controls"><button class="btn">Tocar</button></div></section><section class="music-queue-card"><h2>Biblioteca</h2><div class="music-queue">Fila</div></section></main><aside class="music-add-panel"><section class="music-block"><h2>Tela ao vivo</h2><div class="field"><input value="texto-longo-para-testar-largura-sem-estourar-o-painel"></div><button class="btn full">Compartilhar tela</button></section><section class="music-block"><h2>Adicionar por link</h2><div class="field"><input value="https://youtube.com/watch?v=abcdefghijk"></div><button class="btn full">Adicionar à fila</button></section><section class="music-block"><h2>Pesquisar</h2><div class="music-search-row"><input value="pesquisa"><button class="btn">Pesquisar</button></div></section></aside></section>`;
 await frame();const screen=document.querySelector('.music-screen'),add=document.querySelector('.music-add-panel');pass('music-screen-no-horizontal-overflow',noHorizontalOverflow(screen),`${screen.clientWidth}/${screen.scrollWidth}`);pass('music-tools-width',add.getBoundingClientRect().width>200,`${Math.round(add.getBoundingClientRect().width)}`);if(innerWidth>=1280)pass('music-tools-inside-viewport',insideViewport(add),JSON.stringify(add.getBoundingClientRect().toJSON?.()||{}));else pass('music-tools-not-clipped-horizontally',noHorizontalOverflow(add),`${add.clientWidth}/${add.scrollWidth}`);
}
async function truco(){
 mount.innerHTML=`${focus?'':'<div class="mock-topbar"></div>'}<section class="truco-screen"><div class="truco-table-wrap"><div class="truco-hud"></div><div class="table-shell"><div class="player-seat seat-top"><div class="enemy-hand"><div class="card-back-mini"></div><div class="card-back-mini"></div></div></div><div class="vira-zone"><div class="truco-card"><span class="rank">3</span><span class="suit">♠</span></div></div><div class="play-zone"><div class="play-card p2"><div class="truco-card"><span class="rank">A</span><span class="suit">♥</span></div></div></div></div></div></section>`;await frame();const vira=document.querySelector('.vira-zone .truco-card').getBoundingClientRect(),played=document.querySelector('.play-card.p2').getBoundingClientRect();const intersect=Math.max(0,Math.min(vira.right,played.right)-Math.max(vira.left,played.left))*Math.max(0,Math.min(vira.bottom,played.bottom)-Math.max(vira.top,played.top));pass('truco-vira-readable-size',vira.height>played.height*1.2,`${Math.round(vira.width)}x${Math.round(vira.height)} vs ${Math.round(played.width)}x${Math.round(played.height)}`);pass('truco-top-card-does-not-cover-vira',intersect===0,`intersection=${Math.round(intersect)}`);
}
async function blackjack(){mount.innerHTML=`<section class="blackjack-page"><div class="bj-stage"><article class="bj-player local bj-player-bottom"><div class="bj-player-hands"><div class="bj-hand"><div class="bj-hand-cards">${Array.from({length:5},(_,i)=>`<div class="bj-card"><div class="bj-card-corner"><b>${i+2}</b></div></div>`).join('')}</div></div></div></article></div><section class="bj-controls"><div class="bj-actions"><button class="bj-action hit">PEDIR</button><button class="bj-action stand">PARAR</button><button class="bj-action double">DOBRAR</button><button class="bj-action split">SEPARAR</button></div></section></section>`;await frame();const cards=[...document.querySelectorAll('.bj-card')].map(x=>x.getBoundingClientRect());let overlap=false;for(let i=1;i<cards.length;i++)if(cards[i].left<cards[i-1].right-.5)overlap=true;pass('blackjack-cards-no-overlap',!overlap);pass('blackjack-actions-visible',document.querySelectorAll('.bj-action').length===4);}
(async()=>{if(fixture==='chess')await chess();if(fixture==='music')await music();if(fixture==='truco')await truco();if(fixture==='blackjack')await blackjack();const ok=results.every(x=>x.ok);document.getElementById('results').textContent=(ok?'PASS':'FAIL')+' '+JSON.stringify({fixture,focus,w:innerWidth,h:innerHeight,results});document.body.dataset.result=ok?'pass':'fail';document.body.dataset.report=JSON.stringify(results);})();
</script></body></html>
